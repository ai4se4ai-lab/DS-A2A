[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentm2m"
version = "0.1.0"
description = "AgentM2M: deterministic structure for stochastic LLM-agent teams via hybrid M2M transformations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyecore>=0.15",
    "lark>=1.3",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
eval = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "datasets>=2.19",
    "swebench>=2.1",
]

[project.scripts]
agentm2m = "agentm2m.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
