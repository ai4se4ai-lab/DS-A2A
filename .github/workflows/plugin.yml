name: plugin

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI (for `claude plugin validate`)
        run: npm install -g @anthropic-ai/claude-code
      - name: Install engine
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Validate plugin, templates and run tests
        run: plugin/scripts/validate.sh
      - name: Build and smoke-test the wheel
        run: plugin/scripts/build.sh

  publish:
    # Tag-triggered PyPI release via trusted publishing (no stored token).
    # Gated by the repository variable ALLOW_PUBLIC so nothing is published
    # while the paper is under double-anonymous review.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && vars.ALLOW_PUBLIC == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
